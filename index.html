<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tường Bình Thường</title>
<meta name="description" content="Tủ đồ của Tường Bình Thường — những món tụi mình mặc và dùng thật.">
<script>try{var t=localStorage.getItem('kt-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://docs.google.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Be+Vietnam+Pro:wght@400;500&display=swap">
<style>
/* Layout: ZARA-style monochrome column (480px). Profile header -> segmented tabs -> 2-col grid */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#6b6b6b; --line:#e4e4e4; --tile:#f3f3f3;
  --inv-bg:#111111; --inv-fg:#ffffff;
  --label:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Be Vietnam Pro",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --tile:#1a1a1a;
  --inv-bg:#f2f2f2; --inv-fg:#0c0c0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --tile:#1a1a1a;
  --inv-bg:#f2f2f2; --inv-fg:#0c0c0c; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
.wrap{max-width:480px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.up{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-size:11px}

.bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px}
.bar-r{display:flex;align-items:center;gap:12px}
.theme{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;
  background:none;color:var(--fg);cursor:pointer;padding:0}
.theme:hover{border-color:var(--fg)}
.theme svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme .i-sun{display:none}
.is-dark .theme .i-sun{display:block}
.is-dark .theme .i-moon{display:none}

.profile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--tile)}
h1{font:500 20px/1.2 var(--label);margin:0;text-wrap:balance}
.handle{color:var(--muted);font-size:13px}
.bio{margin:14px 0 10px;white-space:pre-line}
.links{display:flex;flex-wrap:wrap;gap:6px 16px}
.links a{display:inline-flex;align-items:center;gap:6px;color:var(--fg);text-decoration:none;font-size:13px}
.links a:hover{text-decoration:underline}
.links svg{width:16px;height:16px;fill:currentColor}
.cta{display:block;text-align:center;margin-top:16px;padding:12px;border-radius:999px;
  background:var(--inv-bg);color:var(--inv-fg);text-decoration:none;font-weight:500}

.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;padding:4px;border-radius:999px;border:1px solid var(--line)}
.seg button{font:500 14px var(--body);padding:9px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--tile);color:var(--fg)}

.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:20px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font:500 13px var(--body);padding:8px 14px;border:1px solid var(--fg);
  background:var(--bg);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg)}
.showing{color:var(--muted);font-size:13px;margin:14px 0 12px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 10px}
.card{position:relative;min-width:0}
.card a{display:grid;gap:3px;color:inherit;text-decoration:none}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--tile);margin-bottom:8px;display:block}
.card .brand{font-size:13px;font-weight:500}
.card .name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .buy{margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;
  border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.heart svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.heart[aria-pressed="true"] svg{fill:currentColor}

/* loading skeleton */
.sk{background:var(--tile);animation:pulse 1.2s ease-in-out infinite}
.sk-card .sk-img{aspect-ratio:3/4;margin-bottom:8px}
.sk-card .sk-line{height:12px;margin:6px 0;width:70%}
.sk-card .sk-line.s{width:45%}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.msg{color:var(--muted);font-size:13px;text-align:center;padding:32px 8px;grid-column:1/-1}

.channels{display:grid;border-top:1px solid var(--line);margin-top:20px}
.channels a{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);
  color:var(--fg);text-decoration:none}
.channels a span:last-child{color:var(--muted);font-size:13px}

/* sub filter (Outfit → Phi / Tường) */
.filters.sub{margin-top:10px}
.filters.sub[hidden]{display:none}
.filters.sub button{border-color:var(--line);padding:6px 12px;font-size:12px}
.filters.sub button[aria-pressed="true"]{border-color:var(--inv-bg)}

/* lookbook row */
.looks{margin-top:20px}
.looks[hidden]{display:none}
.looks-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.looks-h small{color:var(--muted);font-size:12px}
.looks-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;padding-bottom:2px}
.looks-row::-webkit-scrollbar{display:none}
.look{flex:none;width:44%;max-width:200px;scroll-snap-align:start;border:0;background:none;padding:0;margin:0;
  text-align:left;color:inherit;font:inherit;cursor:pointer;display:grid;gap:2px}
.look img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--tile);display:block;margin-bottom:6px;transition:filter .25s ease}
.look .t{font-size:13px;font-weight:500;line-height:1.35}
.look .n{font-size:12px;color:var(--muted)}
@media (hover:hover){.look:hover img{filter:brightness(.92)}}

/* shop the look overlay */
body.lock{overflow:hidden}
.stl{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.stl[hidden]{display:none}
.stl-top{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  background:var(--bg);border-bottom:1px solid var(--line)}
.stl-top h2{font:500 16px/1.3 var(--label);margin:2px 0 0}
.stl-top .up{color:var(--muted)}
.stl-close{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;
  background:none;color:var(--fg);cursor:pointer;padding:0}
.stl-close:hover{border-color:var(--fg)}
.stl-close svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.stl-stage{position:relative;max-width:480px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px}
.stl-pic{position:relative;line-height:0}
.stl-pic img{display:block;width:100%;height:auto;background:var(--tile)}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;padding:0;cursor:pointer;
  background:var(--bg);color:var(--fg);border:2px solid var(--fg);font:600 12px/1 var(--label);display:grid;place-items:center;
  box-shadow:0 1px 6px rgba(0,0,0,.35);transition:transform .15s ease}
.pin.on,.pin:hover{background:var(--inv-bg);color:var(--inv-fg);transform:translate(-50%,-50%) scale(1.12)}
.stl-col{display:none}
.stl-list{display:grid;gap:10px;margin-top:18px}
.stl-lines{display:none}
.it{display:grid;grid-template-columns:24px 64px 1fr;gap:12px;align-items:center;padding:8px 10px 8px 8px;
  border:1px solid var(--line);color:inherit;text-decoration:none;background:var(--bg);transition:border-color .15s ease}
.it.on,.it:hover{border-color:var(--fg)}
.it .no{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font:600 11px/1 var(--label)}
.it.on .no{background:var(--inv-bg);color:var(--inv-fg)}
.it img{width:64px;height:80px;object-fit:cover;background:var(--tile);display:block}
.it .tx{display:grid;gap:2px;min-width:0}
.it .b{font-size:13px;font-weight:500}
.it .nm{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .buy{margin-top:2px;text-decoration:underline;text-underline-offset:3px;font-size:10px}

footer{margin-top:40px;color:var(--muted);text-align:center}
a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.card img{transition:filter .25s ease}
@media (hover:hover){.card a:hover img{filter:brightness(.92)}.card a:hover .buy{text-decoration-thickness:2px}}

/* ===== Desktop (>= 960px): sidebar profile + wide product grid ===== */
@media (min-width:960px){
  .wrap{max-width:1240px;padding:28px 40px 56px}
  .bar{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:40px}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:64px;align-items:start}
  .side{position:sticky;top:28px}
  .profile{grid-template-columns:1fr;gap:18px}
  .avatar{width:128px;height:128px}
  h1{font-size:26px}
  .handle{font-size:14px;margin-top:4px}
  .bio{margin:18px 0 16px;font-size:15px}
  .links{flex-direction:column;gap:10px}
  .links a{font-size:14px}
  .cta{margin-top:24px}
  .seg,#panel-ch{display:none}
  #panel-shop[hidden]{display:block}
  .filters{margin-top:0;flex-wrap:wrap;overflow:visible}
  .filters button{padding:9px 18px;font-size:14px}
  .showing{margin:18px 0 20px}
  .grid{grid-template-columns:repeat(3,1fr);gap:40px 20px}
  .filters.sub{margin-top:12px}
  .filters.sub button{padding:7px 14px;font-size:13px}
  .looks{margin-top:28px}
  .look{width:200px}
  /* overlay desktop: items left/right, photo center, connector lines */
  .stl-top{padding:16px 40px}
  .stl-top h2{font-size:18px}
  .stl-stage{max-width:none;display:grid;grid-template-columns:minmax(220px,300px) auto minmax(220px,300px);
    justify-content:center;align-items:center;gap:0 88px;min-height:calc(100vh - 74px);padding:32px 40px}
  .stl-pic img{width:auto;max-width:min(560px,40vw);max-height:calc(100vh - 140px)}
  .stl-col{display:flex;flex-direction:column;gap:14px}
  .stl-list{display:none}
  .stl-lines{display:block;position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2}
  .stl-lines path{fill:none;stroke-linejoin:round;transition:opacity .15s ease,stroke-width .15s ease}
  .stl-lines .halo{stroke:var(--bg);stroke-width:3;opacity:.7}
  .stl-lines .ln{stroke:var(--fg);stroke-width:1;opacity:.6}
  .stl-lines .ln.on{opacity:1;stroke-width:2}
  .stl-lines .halo.on{stroke-width:5;opacity:.9}
  .pin{z-index:3}
  .card .brand,.card .name{font-size:14px}
  .card .name{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.9em}
  footer{margin-top:72px;padding-top:24px;border-top:1px solid var(--line)}
}
@media (min-width:1280px){
  .grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>

<main class="wrap">
  <div class="bar"><span class="up" data-k="handle">@ketuong06</span><div class="bar-r"><span class="up">VN</span><button class="theme" id="theme" type="button" aria-label="Chuyển giao diện sáng/tối"><svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div></div>

  <div class="layout">
  <aside class="side">
  <section class="profile">
    <img class="avatar" id="avatar" alt="Tường Bình Thường">
    <div>
      <h1 data-k="ten_kenh">Tường Bình Thường</h1>
      <div class="handle" data-k="handle">@ketuong06</div>
    </div>
  </section>
  <p class="bio" data-k="bio"></p>
  <div class="links" id="links"></div>
  <a class="cta" id="cta" target="_blank" rel="noopener" hidden>Theo dõi trên TikTok</a>
  </aside>

  <div class="content">

  <div class="seg" role="tablist">
    <button id="tab-shop" role="tab" aria-selected="true" aria-controls="panel-shop">Tủ đồ</button>
    <button id="tab-ch" role="tab" aria-selected="false" aria-controls="panel-ch">Kênh</button>
  </div>

  <section id="panel-shop" role="tabpanel" aria-labelledby="tab-shop">
    <div class="filters" id="filters" role="group" aria-label="Lọc sản phẩm"></div>
    <div class="filters sub" id="subfilters" role="group" aria-label="Lọc theo người mặc" hidden></div>
    <section class="looks" id="looks" hidden>
      <div class="looks-h"><span class="up">Shop the look</span><small>Bấm vào ảnh để xem từng món</small></div>
      <div class="looks-row" id="looks-row"></div>
    </section>
    <p class="showing" id="showing" aria-live="polite">Đang tải…</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="panel-ch" role="tabpanel" aria-labelledby="tab-ch" hidden>
    <nav class="channels" id="channels"></nav>
  </section>
  </div>
  </div>

  <footer class="up"><span data-k="ten_kenh">Tường Bình Thường</span> · <span id="year"></span></footer>
</main>

<div class="stl" id="stl" role="dialog" aria-modal="true" aria-labelledby="stl-title" hidden>
  <div class="stl-top">
    <div><span class="up" id="stl-who">Outfit</span><h2 id="stl-title">Outfit</h2></div>
    <button class="stl-close" id="stl-close" type="button" aria-label="Đóng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="stl-stage" id="stl-stage">
    <svg class="stl-lines" id="stl-lines" aria-hidden="true"></svg>
    <div class="stl-col" id="stl-l"></div>
    <div class="stl-pic" id="stl-pic"><img id="stl-img" alt=""></div>
    <div class="stl-col" id="stl-r"></div>
    <div class="stl-list" id="stl-list"></div>
  </div>
</div>

<script>
/* ================== CONFIG ==================
   Data lấy từ Google Sheet "Danh muc san pham".
   Sheet + folder ảnh phải để: Bất kỳ ai có đường liên kết → Người xem. */
const SHEET_ID = '1tWndIGm5J4KH8msgGOZoiox_KW9BdbSx0uhUw4AILEE';
const TAB_PRODUCTS = 'SanPham';
const TAB_INFO = 'ThongTin';
const TAB_LOOKS = 'Outfit';          // ảnh outfit toàn thân
const TAB_LOOK_ITEMS = 'OutfitItem'; // món trong outfit + toạ độ chấm (x, y %)
const IMG_WIDTH = 800;
/* ============================================ */

const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const CACHE_KEY = 'kt-cache-v2', SAVED_KEY = 'kt-saved-v2';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

const ICONS = {
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 2c-2.7 0-3 0-4.1.1C4.4 2.2 2.2 4.4 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.1 3.5 2.3 5.7 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.5-.1 5.7-2.3 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.1-3.5-2.3-5.7-5.8-5.8C15 2 14.7 2 12 2Zm0 1.8c2.7 0 3 0 4 .1 2.6.1 3.9 1.4 4 4 .1 1 .1 1.3.1 4s0 3-.1 4c-.1 2.6-1.4 3.9-4 4-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.6-.1-3.9-1.4-4-4-.1-1-.1-1.3-.1-4s0-3 .1-4c.1-2.6 1.4-3.9 4-4 1-.1 1.3-.1 4-.1Z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.7 15V9l5.8 3-5.8 3Z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.3v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .8.1V9.2a6.2 6.2 0 1 0 5.4 6.2V8.6a7.6 7.6 0 0 0 4.4 1.4V6.7a4.4 4.4 0 0 1-4.4-4.4Z"/></svg>',
  zalo:'<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.7 1.4 5.1 3.7 6.7L5 21.5l4.2-2.3c.9.2 1.8.3 2.8.3 5.5 0 10-3.9 10-8.8S17.5 2 12 2Zm-3.6 11.3H5.9v-.8l1.8-2.6H6v-.8h2.4v.8l-1.8 2.6h1.8v.8Zm2.6 0h-.8V9.1h.8v4.2Zm3.6 0h-2.4V9.1h.8v3.4h1.6v.8Zm3.2-.1a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2Z"/></svg>'
};
const CHANNELS = [
  {k:'tiktok', label:'TikTok'}, {k:'instagram', label:'Instagram'},
  {k:'youtube', label:'YouTube'}, {k:'zalo', label:'Zalo'}
];

/* ---------- data ---------- */
const sheetUrl = tab =>
  'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(tab) + '&t=' + Date.now();

function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++ } else q = false }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = '' }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row) }
  return rows;
}
function toObjects(rows){
  const [head, ...body] = rows;
  const keys = head.map(h => h.trim().toLowerCase());
  return body.filter(r => r.some(v => v.trim() !== ''))
    .map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] ?? '').trim()])));
}
async function fetchTab(tab){
  const res = await fetch(sheetUrl(tab));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if (/^\s*</.test(text)) throw new Error('not-public'); // Google trả trang đăng nhập = Sheet chưa public
  return toObjects(parseCSV(text));
}

/* ---------- helpers ---------- */
function driveId(url){
  const m = String(url).match(/(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{20,})/);
  return m ? m[1] : null;
}
function imgSrc(url, w){
  const id = driveId(url);
  return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w' + (w || IMG_WIDTH) : url;
}
function imgFallback(img, url, w){
  const id = driveId(url);
  if (!id) return;
  img.addEventListener('error', () => {
    if (img.dataset.fb) return; img.dataset.fb = 1;
    img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (w || IMG_WIDTH);
  }, {once:true});
}
const isOn = v => !/^(false|0|no|không|khong|ẩn|an)$/i.test(String(v).trim()); // trống = hiện
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';

/* ---------- render ---------- */
function renderInfo(info){
  const kv = Object.fromEntries(info.map(r => [r.key, r.value]));
  $$('[data-k]').forEach(n => { if (kv[n.dataset.k]) n.textContent = kv[n.dataset.k] });
  if (kv.ten_kenh) document.title = kv.ten_kenh;

  const av = $('#avatar');
  if (kv.avatar){ av.src = imgSrc(kv.avatar); imgFallback(av, kv.avatar) }
  if (kv.ten_kenh) av.alt = kv.ten_kenh;

  const links = $('#links'), chs = $('#channels');
  links.replaceChildren(); chs.replaceChildren();
  let n = 0;
  CHANNELS.forEach(({k, label}) => {
    const url = kv[k]; if (!url) return; n++;
    const handle = url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '').split('/').pop();
    if (k !== 'tiktok'){
      const a = el('a'); a.href = safeUrl(url); a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = ICONS[k]; a.append(handle.replace(/^@/, ''));
      links.append(a);
    }
    const c = el('a'); c.href = safeUrl(url); c.target = '_blank'; c.rel = 'noopener';
    c.append(el('span', null, label), el('span', null, handle + ' ↗'));
    chs.append(c);
  });
  const cta = $('#cta');
  if (kv.tiktok){ cta.href = safeUrl(kv.tiktok); cta.hidden = false }
}

let saved = store.get(SAVED_KEY, []);
function card(p){
  const d = el('div', 'card'); d.dataset.c = p.nhom || 'Khác'; d.dataset.w = p.nguoi || '';
  const a = el('a'); a.href = safeUrl(p.link_mua); a.target = '_blank'; a.rel = 'noopener sponsored';
  const img = el('img'); img.loading = 'lazy'; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
  img.alt = [p.brand, p.ten].filter(Boolean).join(' – ');
  if (p.anh){ img.src = imgSrc(p.anh); imgFallback(img, p.anh) }
  a.append(img, el('span', 'brand', p.brand), el('span', 'name', p.ten));
  a.append(el('span', 'buy up', 'Mua ngay'));

  const id = p.id || p.ten;
  const h = el('button', 'heart'); h.setAttribute('aria-label', 'Lưu ' + (p.ten || ''));
  h.setAttribute('aria-pressed', saved.includes(id));
  h.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>';
  h.addEventListener('click', () => {
    const on = h.getAttribute('aria-pressed') !== 'true'; h.setAttribute('aria-pressed', on);
    saved = on ? [...new Set([...saved, id])] : saved.filter(x => x !== id);
    store.set(SAVED_KEY, saved);
  });
  d.append(a, h);
  return d;
}

const OUTFIT = 'Outfit';
const SUBS = [{k:'all', label:'Tất cả'}, {k:'Phi', label:'Đồ Phi mặc'}, {k:'Tường', label:'Đồ Tường mặc'}];
let current = 'all', sub = 'all';
let PRODUCTS = [], LOOKS = [], LOOK_ITEMS = [];
// món để trống người mặc hoặc "Cả hai" thì hiện ở cả 2 bên
const forWho = (who, s) => s === 'all' || !who || who === s || /^c(ả|a) hai$/i.test(who);
const desk = window.matchMedia('(min-width: 960px)');
const canHover = window.matchMedia('(hover: hover)');

function renderProducts(list){
  PRODUCTS = list;
  const items = list.filter(p => isOn(p.hien_thi) && (p.ten || p.brand));

  let groups = [...new Set(items.map(p => p.nhom || 'Khác'))];
  if (groups.includes(OUTFIT)) groups = [OUTFIT, ...groups.filter(g => g !== OUTFIT)];
  if (current !== 'all' && !groups.includes(current)) current = 'all';
  const fwrap = $('#filters'); fwrap.replaceChildren();
  ['all', ...groups].forEach(g => {
    const b = el('button', null, g === 'all' ? 'Tất cả' : g); b.type = 'button';
    b.dataset.f = g;
    b.addEventListener('click', () => { current = g; sub = 'all'; applyFilter() });
    fwrap.append(b);
  });
  const swrap = $('#subfilters'); swrap.replaceChildren();
  SUBS.forEach(({k, label}) => {
    const b = el('button', null, label); b.type = 'button'; b.dataset.s = k;
    b.addEventListener('click', () => { sub = k; applyFilter() });
    swrap.append(b);
  });

  const grid = $('#grid'); grid.replaceChildren();
  if (!items.length){ grid.append(el('p', 'msg', 'Chưa có món nào. Quay lại sau nha!')) }
  items.forEach(p => grid.append(card(p)));
  applyFilter();
}
function applyFilter(){
  let n = 0;
  $$('#filters button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === current));
  $('#subfilters').hidden = current !== OUTFIT;
  $$('#subfilters button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === sub));
  $$('#grid .card').forEach(c => {
    c.hidden = (current !== 'all' && c.dataset.c !== current) || (current === OUTFIT && !forWho(c.dataset.w, sub));
    if (!c.hidden) n++;
  });
  $('#showing').textContent = 'Đang hiện ' + n + ' món';
  renderLooks();
}

/* ---------- lookbook + shop the look ---------- */
const num = v => parseFloat(String(v).replace(',', '.'));
const clamp = v => Math.min(100, Math.max(0, v));
function itemsOf(id){
  return LOOK_ITEMS.filter(r => r.outfit_id === id)
    .map(r => ({p: PRODUCTS.find(p => p.id === r.sp_id), x: num(r.x), y: num(r.y)}))
    .filter(r => r.p && !isNaN(r.x) && !isNaN(r.y))
    .map(r => ({p: r.p, x: clamp(r.x), y: clamp(r.y)}));
}
const visibleLooks = () => LOOKS.filter(o => isOn(o.hien_thi) && o.id && o.anh);
function renderLooks(){
  const list = current === OUTFIT ? visibleLooks().filter(o => sub === 'all' || o.nguoi === sub) : [];
  $('#looks').hidden = !list.length;
  $('#looks-row').replaceChildren(...list.map(o => {
    const b = el('button', 'look'); b.type = 'button';
    const img = el('img'); img.loading = 'lazy'; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
    img.alt = o.ten || 'Outfit'; img.src = imgSrc(o.anh); imgFallback(img, o.anh);
    b.append(img, el('span', 'up', 'Outfit · ' + (o.nguoi || '')), el('span', 't', o.ten || ''), el('span', 'n', itemsOf(o.id).length + ' món'));
    b.addEventListener('click', () => openLook(o.id));
    return b;
  }));
}
function itemCard(p, no){
  const a = el('a', 'it'); a.href = safeUrl(p.link_mua); a.target = '_blank'; a.rel = 'noopener sponsored'; a.dataset.i = no;
  const img = el('img'); img.loading = 'lazy'; img.alt = ''; img.referrerPolicy = 'no-referrer';
  if (p.anh){ img.src = imgSrc(p.anh, 300); imgFallback(img, p.anh, 300) }
  const tx = el('span', 'tx'); tx.append(el('span', 'b', p.brand), el('span', 'nm', p.ten), el('span', 'buy up', 'Mua ngay'));
  a.append(el('span', 'no', String(no)), img, tx);
  a.addEventListener('mouseenter', () => { if (canHover.matches) focusItem(no) });
  a.addEventListener('focus', () => focusItem(no));
  return a;
}
function focusItem(no, scroll){
  $$('#stl [data-i]').forEach(e => e.classList.toggle('on', e.dataset.i === String(no)));
  if (scroll && !desk.matches){
    const c = $('#stl-list [data-i="' + no + '"]');
    if (c) c.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
}
function showLook(id){
  const o = visibleLooks().find(x => x.id === id);
  if (!o){ hideLook(); return }
  const its = itemsOf(id).sort((a, b) => a.y - b.y);
  $('#stl-who').textContent = 'Outfit · ' + (o.nguoi || '');
  $('#stl-title').textContent = o.ten || 'Outfit';
  const img = $('#stl-img'); delete img.dataset.fb; img.referrerPolicy = 'no-referrer';
  img.alt = o.ten || 'Outfit'; img.onload = drawLines; img.src = imgSrc(o.anh, 1400); imgFallback(img, o.anh, 1400);
  const pic = $('#stl-pic'); pic.querySelectorAll('.pin').forEach(x => x.remove());
  const L = $('#stl-l'), Rc = $('#stl-r'), list = $('#stl-list');
  [L, Rc, list].forEach(x => x.replaceChildren());
  its.forEach((it, i) => {
    const no = i + 1;
    const pin = el('button', 'pin', String(no)); pin.type = 'button'; pin.dataset.i = no;
    pin.style.left = it.x + '%'; pin.style.top = it.y + '%';
    pin.setAttribute('aria-label', no + '. ' + [it.p.brand, it.p.ten].filter(Boolean).join(' – '));
    pin.addEventListener('click', () => focusItem(no, true));
    pin.addEventListener('mouseenter', () => { if (canHover.matches) focusItem(no) });
    pic.append(pin);
    (it.x < 50 ? L : Rc).append(itemCard(it.p, no));
    list.append(itemCard(it.p, no));
  });
  if (!its.length) list.append(el('p', 'msg', 'Outfit này chưa gắn món nào.'));
  const stl = $('#stl'); stl.hidden = false; stl.scrollTop = 0;
  document.body.classList.add('lock');
  requestAnimationFrame(drawLines);
  $('#stl-close').focus({preventScroll: true});
}
function hideLook(){
  $('#stl').hidden = true; document.body.classList.remove('lock');
}
function openLook(id){
  history.pushState({kt: 1}, '', '#look-' + encodeURIComponent(id));
  showLook(id);
}
function closeLook(){
  if (history.state && history.state.kt) history.back();
  else { history.replaceState(null, '', location.pathname + location.search); hideLook() }
}
function route(){
  const m = location.hash.match(/^#look-(.+)$/);
  if (m) showLook(decodeURIComponent(m[1])); else if (!$('#stl').hidden) hideLook();
}
function drawLines(){
  const svg = $('#stl-lines'); svg.replaceChildren();
  if ($('#stl').hidden || !desk.matches) return;
  const st = $('#stl-stage').getBoundingClientRect(), pic = $('#stl-img').getBoundingClientRect();
  svg.setAttribute('width', st.width); svg.setAttribute('height', st.height);
  $$('#stl-pic .pin').forEach(pin => {
    const no = pin.dataset.i, c = $('.stl-col [data-i="' + no + '"]'); if (!c) return;
    const pr = pin.getBoundingClientRect(), cr = c.getBoundingClientRect(), left = cr.right <= pic.left + 1;
    const dx = pr.left + pr.width / 2 - st.left, dy = pr.top + pr.height / 2 - st.top;
    const ax = (left ? cr.right : cr.left) - st.left, ay = cr.top + cr.height / 2 - st.top;
    const ex = (left ? pic.left - 28 : pic.right + 28) - st.left;
    const d = 'M' + ax + ' ' + ay + ' H' + ex + ' L' + dx + ' ' + dy;
    ['halo', 'ln'].forEach(cls => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d); path.setAttribute('class', cls); path.dataset.i = no; svg.append(path);
    });
  });
}
$('#stl-close').addEventListener('click', closeLook);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#stl').hidden) closeLook() });
window.addEventListener('popstate', route);
window.addEventListener('resize', drawLines);
if (window.ResizeObserver) new ResizeObserver(drawLines).observe($('#stl-stage'));
function skeleton(){
  const g = $('#grid'); g.replaceChildren();
  for (let i = 0; i < 4; i++){
    const c = el('div', 'sk-card');
    c.append(el('div', 'sk sk-img'), el('div', 'sk sk-line'), el('div', 'sk sk-line s'));
    g.append(c);
  }
}

/* ---------- theme toggle (manual override, else follow system) ---------- */
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : mq.matches };
const syncTheme = () => {
  const d = isDark(); document.documentElement.classList.toggle('is-dark', d);
  $('#theme').setAttribute('aria-pressed', d);
  $('#theme').title = d ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối';
};
$('#theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('kt-theme', next) }catch(e){}
  syncTheme();
});
mq.addEventListener ? mq.addEventListener('change', syncTheme) : mq.addListener(syncTheme);
syncTheme();

/* ---------- tabs ---------- */
$$('.seg button').forEach(t => t.addEventListener('click', () => {
  $$('.seg button').forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); document.getElementById(x.getAttribute('aria-controls')).hidden = !on });
}));
$('#year').textContent = new Date().getFullYear();

/* ---------- boot: hiện cache ngay, rồi lấy data mới ---------- */
(async () => {
  const cache = store.get(CACHE_KEY, null);
  if (cache){
    LOOKS = cache.looks || []; LOOK_ITEMS = cache.lookItems || [];
    renderInfo(cache.info); renderProducts(cache.products); route();
  } else skeleton();
  try{
    const opt = t => fetchTab(t).catch(() => []);
    const [products, info, looks, lookItems] = await Promise.all([fetchTab(TAB_PRODUCTS), fetchTab(TAB_INFO), opt(TAB_LOOKS), opt(TAB_LOOK_ITEMS)]);
    LOOKS = looks; LOOK_ITEMS = lookItems;
    renderInfo(info); renderProducts(products);
    if (!$('#stl').hidden || location.hash) route();
    store.set(CACHE_KEY, {products, info, looks, lookItems});
  }catch(e){
    console.error('[ketuong] load failed:', e);
    if (!cache){
      $('#grid').replaceChildren(el('p', 'msg', 'Không tải được danh mục. Thử tải lại trang nha.'));
      $('#showing').textContent = '';
    }
  }
})();
</script>
</body>
