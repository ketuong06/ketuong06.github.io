<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tường Bình Thường</title>
<meta name="description" content="Tủ đồ của Tường Bình Thường — những món tụi mình mặc và dùng thật.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://docs.google.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Be+Vietnam+Pro:wght@400;500&display=swap">
<style>
/* Layout: ZARA-style monochrome column (480px). Profile header -> segmented tabs -> 2-col grid */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#6b6b6b; --line:#e4e4e4; --tile:#f3f3f3;
  --inv-bg:#111111; --inv-fg:#ffffff;
  --label:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Be Vietnam Pro",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --fg:#f2f2f2; --muted:#9a9a9a; --line:#262626; --tile:#1a1a1a;
  --inv-bg:#f2f2f2; --inv-fg:#0c0c0c; color-scheme:dark}}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
.wrap{max-width:480px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.up{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-size:11px}

.bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px}
.bar b{font:600 15px var(--label);letter-spacing:.22em;text-transform:uppercase}

.profile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--tile)}
h1{font:500 20px/1.2 var(--label);margin:0;text-wrap:balance}
.handle{color:var(--muted);font-size:13px}
.stats{display:flex;gap:20px;margin-top:8px}
.stats div{display:grid;line-height:1.2}
.stats strong{font:600 16px var(--label);font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:12px}
.bio{margin:14px 0 10px;white-space:pre-line}
.links{display:flex;flex-wrap:wrap;gap:6px 16px}
.links a{display:inline-flex;align-items:center;gap:6px;color:var(--fg);text-decoration:none;font-size:13px}
.links a:hover{text-decoration:underline}
.links svg{width:16px;height:16px;fill:currentColor}
.cta{display:block;text-align:center;margin-top:16px;padding:12px;border-radius:999px;
  background:var(--inv-bg);color:var(--inv-fg);text-decoration:none;font-weight:500}

.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;padding:4px;border-radius:999px;border:1px solid var(--line)}
.seg button{font:500 14px var(--body);padding:9px;border:0;border-radius:999px;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--tile);color:var(--fg)}

.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:20px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font:500 13px var(--body);padding:8px 14px;border:1px solid var(--fg);
  background:var(--bg);color:var(--fg);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg)}
.showing{color:var(--muted);font-size:13px;margin:14px 0 12px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 10px}
.card{position:relative;min-width:0}
.card a{display:grid;gap:3px;color:inherit;text-decoration:none}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--tile);margin-bottom:8px;display:block}
.card .brand{font-size:13px;font-weight:500}
.card .name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .buy{margin-top:4px;text-decoration:underline;text-underline-offset:3px}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;
  border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.heart svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.heart[aria-pressed="true"] svg{fill:currentColor}

/* loading skeleton */
.sk{background:var(--tile);animation:pulse 1.2s ease-in-out infinite}
.sk-card .sk-img{aspect-ratio:3/4;margin-bottom:8px}
.sk-card .sk-line{height:12px;margin:6px 0;width:70%}
.sk-card .sk-line.s{width:45%}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.msg{color:var(--muted);font-size:13px;text-align:center;padding:32px 8px;grid-column:1/-1}

.channels{display:grid;border-top:1px solid var(--line);margin-top:20px}
.channels a{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);
  color:var(--fg);text-decoration:none}
.channels a span:last-child{color:var(--muted);font-size:13px}

footer{margin-top:40px;color:var(--muted);text-align:center}
a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>

<main class="wrap">
  <div class="bar"><span class="up" data-k="handle">@ketuong06</span><b>Tường</b><span class="up">VN</span></div>

  <section class="profile">
    <img class="avatar" id="avatar" alt="Tường Bình Thường">
    <div>
      <h1 data-k="ten_kenh">Tường Bình Thường</h1>
      <div class="handle" data-k="handle">@ketuong06</div>
      <div class="stats">
        <div><strong id="stat-items">–</strong><span>món đồ</span></div>
        <div><strong id="stat-ch">–</strong><span>kênh</span></div>
      </div>
    </div>
  </section>
  <p class="bio" data-k="bio"></p>
  <div class="links" id="links"></div>
  <a class="cta" id="cta" target="_blank" rel="noopener" hidden>Theo dõi trên TikTok</a>

  <div class="seg" role="tablist">
    <button id="tab-shop" role="tab" aria-selected="true" aria-controls="panel-shop">Tủ đồ</button>
    <button id="tab-ch" role="tab" aria-selected="false" aria-controls="panel-ch">Kênh</button>
  </div>

  <section id="panel-shop" role="tabpanel" aria-labelledby="tab-shop">
    <div class="filters" id="filters" role="group" aria-label="Lọc sản phẩm"></div>
    <p class="showing" id="showing" aria-live="polite">Đang tải…</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="panel-ch" role="tabpanel" aria-labelledby="tab-ch" hidden>
    <nav class="channels" id="channels"></nav>
  </section>

  <footer class="up"><span data-k="ten_kenh">Tường Bình Thường</span> · <span id="year"></span></footer>
</main>

<script>
/* ================== CONFIG ==================
   Data lấy từ Google Sheet "Danh muc san pham".
   Sheet + folder ảnh phải để: Bất kỳ ai có đường liên kết → Người xem. */
const SHEET_ID = '1tWndIGm5J4KH8msgGOZoiox_KW9BdbSx0uhUw4AILEE';
const TAB_PRODUCTS = 'SanPham';
const TAB_INFO = 'ThongTin';
const IMG_WIDTH = 800;
/* ============================================ */

const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const CACHE_KEY = 'kt-cache-v1', SAVED_KEY = 'kt-saved-v2';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

const ICONS = {
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 2c-2.7 0-3 0-4.1.1C4.4 2.2 2.2 4.4 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.1 3.5 2.3 5.7 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.5-.1 5.7-2.3 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.1-3.5-2.3-5.7-5.8-5.8C15 2 14.7 2 12 2Zm0 1.8c2.7 0 3 0 4 .1 2.6.1 3.9 1.4 4 4 .1 1 .1 1.3.1 4s0 3-.1 4c-.1 2.6-1.4 3.9-4 4-1 .1-1.3.1-4 .1s-3 0-4-.1c-2.6-.1-3.9-1.4-4-4-.1-1-.1-1.3-.1-4s0-3 .1-4c.1-2.6 1.4-3.9 4-4 1-.1 1.3-.1 4-.1Z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.7 15V9l5.8 3-5.8 3Z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M16.6 2h-3.3v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .8.1V9.2a6.2 6.2 0 1 0 5.4 6.2V8.6a7.6 7.6 0 0 0 4.4 1.4V6.7a4.4 4.4 0 0 1-4.4-4.4Z"/></svg>',
  zalo:'<svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.7 1.4 5.1 3.7 6.7L5 21.5l4.2-2.3c.9.2 1.8.3 2.8.3 5.5 0 10-3.9 10-8.8S17.5 2 12 2Zm-3.6 11.3H5.9v-.8l1.8-2.6H6v-.8h2.4v.8l-1.8 2.6h1.8v.8Zm2.6 0h-.8V9.1h.8v4.2Zm3.6 0h-2.4V9.1h.8v3.4h1.6v.8Zm3.2-.1a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2Z"/></svg>'
};
const CHANNELS = [
  {k:'tiktok', label:'TikTok'}, {k:'instagram', label:'Instagram'},
  {k:'youtube', label:'YouTube'}, {k:'zalo', label:'Zalo'}
];

/* ---------- data ---------- */
const sheetUrl = tab =>
  'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(tab) + '&t=' + Date.now();

function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++ } else q = false }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = '' }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row) }
  return rows;
}
function toObjects(rows){
  const [head, ...body] = rows;
  const keys = head.map(h => h.trim().toLowerCase());
  return body.filter(r => r.some(v => v.trim() !== ''))
    .map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] ?? '').trim()])));
}
async function fetchTab(tab){
  const res = await fetch(sheetUrl(tab));
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if (/^\s*</.test(text)) throw new Error('not-public'); // Google trả trang đăng nhập = Sheet chưa public
  return toObjects(parseCSV(text));
}

/* ---------- helpers ---------- */
function driveId(url){
  const m = String(url).match(/(?:\/d\/|[?&]id=)([A-Za-z0-9_-]{20,})/);
  return m ? m[1] : null;
}
function imgSrc(url){
  const id = driveId(url);
  return id ? 'https://lh3.googleusercontent.com/d/' + id + '=w' + IMG_WIDTH : url;
}
function imgFallback(img, url){
  const id = driveId(url);
  if (!id) return;
  img.addEventListener('error', () => {
    if (img.dataset.fb) return; img.dataset.fb = 1;
    img.src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + IMG_WIDTH;
  }, {once:true});
}
const isOn = v => !/^(false|0|no|không|khong|ẩn|an)$/i.test(String(v).trim()); // trống = hiện
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '#';

/* ---------- render ---------- */
function renderInfo(info){
  const kv = Object.fromEntries(info.map(r => [r.key, r.value]));
  $$('[data-k]').forEach(n => { if (kv[n.dataset.k]) n.textContent = kv[n.dataset.k] });
  if (kv.ten_kenh) document.title = kv.ten_kenh;

  const av = $('#avatar');
  if (kv.avatar){ av.src = imgSrc(kv.avatar); imgFallback(av, kv.avatar) }
  if (kv.ten_kenh) av.alt = kv.ten_kenh;

  const links = $('#links'), chs = $('#channels');
  links.replaceChildren(); chs.replaceChildren();
  let n = 0;
  CHANNELS.forEach(({k, label}) => {
    const url = kv[k]; if (!url) return; n++;
    const handle = url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '').split('/').pop();
    if (k !== 'tiktok'){
      const a = el('a'); a.href = safeUrl(url); a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = ICONS[k]; a.append(handle.replace(/^@/, ''));
      links.append(a);
    }
    const c = el('a'); c.href = safeUrl(url); c.target = '_blank'; c.rel = 'noopener';
    c.append(el('span', null, label), el('span', null, handle + ' ↗'));
    chs.append(c);
  });
  $('#stat-ch').textContent = n;
  const cta = $('#cta');
  if (kv.tiktok){ cta.href = safeUrl(kv.tiktok); cta.hidden = false }
}

let saved = store.get(SAVED_KEY, []);
function card(p){
  const d = el('div', 'card'); d.dataset.c = p.nhom || 'Khác';
  const a = el('a'); a.href = safeUrl(p.link_mua); a.target = '_blank'; a.rel = 'noopener sponsored';
  const img = el('img'); img.loading = 'lazy'; img.decoding = 'async'; img.referrerPolicy = 'no-referrer';
  img.alt = [p.brand, p.ten].filter(Boolean).join(' – ');
  if (p.anh){ img.src = imgSrc(p.anh); imgFallback(img, p.anh) }
  a.append(img, el('span', 'brand', p.brand), el('span', 'name', p.ten));
  a.append(el('span', 'buy up', 'Mua ngay'));

  const id = p.id || p.ten;
  const h = el('button', 'heart'); h.setAttribute('aria-label', 'Lưu ' + (p.ten || ''));
  h.setAttribute('aria-pressed', saved.includes(id));
  h.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>';
  h.addEventListener('click', () => {
    const on = h.getAttribute('aria-pressed') !== 'true'; h.setAttribute('aria-pressed', on);
    saved = on ? [...new Set([...saved, id])] : saved.filter(x => x !== id);
    store.set(SAVED_KEY, saved);
  });
  d.append(a, h);
  return d;
}

let current = 'all';
function renderProducts(list){
  const items = list.filter(p => isOn(p.hien_thi) && (p.ten || p.brand));
  $('#stat-items').textContent = items.length;

  const groups = [...new Set(items.map(p => p.nhom || 'Khác'))];
  if (current !== 'all' && !groups.includes(current)) current = 'all';
  const fwrap = $('#filters'); fwrap.replaceChildren();
  ['all', ...groups].forEach(g => {
    const b = el('button', null, g === 'all' ? 'Tất cả' : g);
    b.dataset.f = g; b.setAttribute('aria-pressed', g === current);
    b.addEventListener('click', () => { current = g; applyFilter() });
    fwrap.append(b);
  });

  const grid = $('#grid'); grid.replaceChildren();
  if (!items.length){ grid.append(el('p', 'msg', 'Chưa có món nào. Quay lại sau nha!')) }
  items.forEach(p => grid.append(card(p)));
  applyFilter();
}
function applyFilter(){
  let n = 0;
  $$('#filters button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === current));
  $$('#grid .card').forEach(c => { c.hidden = current !== 'all' && c.dataset.c !== current; if (!c.hidden) n++ });
  $('#showing').textContent = 'Đang hiện ' + n + ' món';
}
function skeleton(){
  const g = $('#grid'); g.replaceChildren();
  for (let i = 0; i < 4; i++){
    const c = el('div', 'sk-card');
    c.append(el('div', 'sk sk-img'), el('div', 'sk sk-line'), el('div', 'sk sk-line s'));
    g.append(c);
  }
}

/* ---------- tabs ---------- */
$$('.seg button').forEach(t => t.addEventListener('click', () => {
  $$('.seg button').forEach(x => { const on = x === t; x.setAttribute('aria-selected', on); document.getElementById(x.getAttribute('aria-controls')).hidden = !on });
}));
$('#year').textContent = new Date().getFullYear();

/* ---------- boot: hiện cache ngay, rồi lấy data mới ---------- */
(async () => {
  const cache = store.get(CACHE_KEY, null);
  if (cache){ renderInfo(cache.info); renderProducts(cache.products) } else skeleton();
  try{
    const [products, info] = await Promise.all([fetchTab(TAB_PRODUCTS), fetchTab(TAB_INFO)]);
    renderInfo(info); renderProducts(products);
    store.set(CACHE_KEY, {products, info});
  }catch(e){
    console.error('[ketuong] load failed:', e);
    if (!cache){
      $('#grid').replaceChildren(el('p', 'msg', 'Không tải được danh mục. Thử tải lại trang nha.'));
      $('#showing').textContent = '';
    }
  }
})();
</script>
</body>
</html>
